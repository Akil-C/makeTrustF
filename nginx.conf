server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version from potential reconnaissance scanners
    server_tokens off;

    # Enforce request payload size threshold (anti-DoS buffer protection)
    client_max_body_size 12M;

    # ── Enterprise Defense-in-Depth Security Headers ───────────────────────────
    # Clickjacking protection: only allow same origin framing
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-type sniffing exploits
    add_header X-Content-Type-Options "nosniff" always;

    # Legacy browser XSS filter reactivation
    add_header X-XSS-Protection "1; mode=block" always;

    # Cross-origin privacy protection: omit path on insecure or external origins
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Feature & Hardware Access Policy: disable unused hardware primitives
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;

    # Content Security Policy: enforce trusted script, style, font, and connect origins
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:8080 http://localhost:5173 https://* ws: wss:; frame-src https://challenges.cloudflare.com;" always;

    # Single Page Application fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend API communications with client IP propagation
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Performance compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
